name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GITHUB_ACTIONS: true
          VITE_BASE: /
          CNAME_DOMAIN: pipnationacademy.com
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy-functions:
    runs-on: ubuntu-latest
    needs: build
    # Requires SUPABASE_ACCESS_TOKEN secret in GitHub repository settings.
    # Get your token at: https://supabase.com/dashboard/account/tokens
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare edge function files
        run: |
          mkdir -p supabase/functions/make-server-0991178c
          cp src/supabase/functions/make-server-0991178c/index.ts supabase/functions/make-server-0991178c/index.ts
          cp src/supabase/functions/make-server-0991178c/kv_store.tsx supabase/functions/make-server-0991178c/kv_store.tsx

      - name: Deploy Edge Function
        run: supabase functions deploy make-server-0991178c --project-ref uhchrunehrcbhbyzpvwg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4